<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heardle Clone</title><link rel="stylesheet" href="/src/style.css"></head>
<body><main id="app">
<h1>Heardle Clone</h1>
<p class="sub">Guess the song from the intro. A new song every day.</p>
<div id="board"></div>
<div class="bar"><div id="fill"></div></div>
<button id="play">Play</button>
<div id="guessbox"><input id="guess" placeholder="Search for a song" autocomplete="off"><ul id="sugg"></ul>
<div class="row"><button id="skip">Skip</button><button id="submit">Submit</button></div></div>
<div id="end" hidden></div>
<a class="badge" href="https://music.apple.com/" target="_blank" rel="noopener">Listen on Apple Music</a>
<footer>Clips are 30-second previews from Apple Music. This is a non-commercial fan project with no ads. Not affiliated with Apple, Spotify or the original Heardle.</footer>
</main><script type="module" src="/src/main.js"></script></body></html>
